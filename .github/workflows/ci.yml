name: ci

on:
  push:
    branches: [main, console, "release/**"]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: control-plane/go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

  # End-to-end: build the base image + sandboxd and drive the real
  # create -> seed -> install -> serve -> wake lifecycle on Docker. Also
  # smoke-tests the image (agent CLIs + default template on PATH), so a
  # change that drops OpenCode or the react-standard template fails here.
  #
  # Matrixed across amd64 and arm64 hosted runners — sandboxd's images are
  # built natively (no cross-compilation), so arm64 (Apple Silicon, Graviton,
  # etc.) only stays working if it's actually built and driven end-to-end
  # here, not just assumed from multi-arch base images.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: control-plane/go.mod

      - name: build sandboxd
        run: cd control-plane && go build -o /tmp/sandboxd ./cmd/sandboxd

      - name: build base image
        run: docker build -f image/Dockerfile -t sandboxd-base:ci .

      - name: cold Vite environment reload and shutdown
        run: |
          docker run --rm --init --network none --cpus 1 --memory 1g \
            --entrypoint bash \
            -v "$PWD/scripts/vite-reload-regression.mjs:/opt/reload-regression.mjs:ro" \
            -e RELOAD_USE_INSTALLED_PATCH=1 -e RELOAD_EXIT_AFTER_REPORT=1 \
            sandboxd-base:ci -lc '
              set -eu
              mkdir -p /tmp/reload-app
              cp -a /opt/templates/react-pro/. /tmp/reload-app/
              cd /tmp/reload-app
              cp /opt/reload-regression.mjs reload-regression.mjs
              echo DISPOSABLE_COLD_RELOAD_ONLY > README.reload-fixture.txt
              node reload-regression.mjs
              cat reload-results.json
            '

      - name: optional PostgreSQL persistence and cold recovery
        run: |
          docker run --rm --init --network none --cpus 2 --memory 1g \
            --entrypoint node sandboxd-base:ci -e '
              const fs = require("fs"), os = require("os"), path = require("path");
              if (fs.existsSync(path.join(os.homedir(), ".baarcha-postgres"))) throw Error("Database initialized without project opt-in");
            '
          docker run --rm --init --network none --cpus 2 --memory 1g \
            --entrypoint node \
            -v "$PWD/image/services/postgres/paths.test.mjs:/opt/services/postgres/paths.test.mjs:ro" \
            -v "$PWD/image/services/postgres/worker.test.mjs:/opt/services/postgres/worker.test.mjs:ro" \
            sandboxd-base:ci --test /opt/services/postgres/paths.test.mjs /opt/services/postgres/worker.test.mjs

      - name: e2e
        env:
          SANDBOXD_IMAGE: sandboxd-base:ci
          SANDBOXD_BIN: /tmp/sandboxd
        run: bash scripts/e2e.sh

  # Console is a /v1 client: typecheck, unit-test, and build it directly (not
  # only via docker) so a TS/test/build break is caught with clear output.
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm exec tsc --noEmit
      - name: unit tests
        run: pnpm test
      - name: build
        run: pnpm build
      - name: build console image
        working-directory: .
        run: docker build -t sandboxd-console:ci ./console

  # Installer smoke test on BOTH Linux and real macOS (macos-latest is Apple
  # hardware). Docker can't run macOS, so this exercises install.sh's shell
  # logic with docker stubbed — catching BSD/GNU (sed, mktemp), bash-3.2, and
  # the Darwin data-dir portability issues on the actual OS.
  install:
    name: install-smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: parse install.sh
        run: bash -n install.sh
      - name: install.sh platform logic (docker stubbed)
        run: bash scripts/test-install.sh
